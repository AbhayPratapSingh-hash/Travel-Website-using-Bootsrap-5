<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-card {
            border: none;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        


        .btn-primary {
            background-color: #1e3c72;
            border-color: #1e3c72;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: #2a5298;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .form-control:focus {
            border-color: #1e3c72;
            box-shadow: 0 0 0 0.25rem rgba(30, 60, 114, 0.25);
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        
        <div class="card shadow-lg p-4 login-card" style="max-width: 400px; width: 100%;">
            <div class="card-body">
                
                <div class="text-center mb-4">
                    
                    <h2 class="card-title fw-bold" style="color: #333;">Travel Login</h2>
                    <p class="text-muted small">Welcome back to your next adventure</p>
                </div>
                
                <form action="home.html">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" placeholder="Your Name">
                        <label for="username"><i class="bi bi-person me-2"></i>Username</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="password" placeholder="Your Password">
                        <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold rounded-pill">
                            LOGIN
                        </button>
                    </div>
                </form>

                <p class="text-center mt-4 mb-0 text-muted">
                    Don't have an account? <a href="create a acount.html" class="text-decoration-none fw-bold" style="color: #2a5298;">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
